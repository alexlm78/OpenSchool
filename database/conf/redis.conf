# redis.conf base - critic flags (password, maxmemory, persistency)

# Network
bind 0.0.0.0
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logging
loglevel notice

# Snapshotting (RDB)
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF
aof-use-rdb-preamble yes

# Performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
io-threads 2

# Clients limits
maxclients 10000
